############################################
# ? SPRING BOOT APPLICATION CONFIGURATION
############################################

# Application name
spring.application.name=midas-core

############################################
# ? KAFKA CONFIGURATION (FOR EMBEDDED KAFKA)
############################################

# ? Ensures Spring uses the embedded Kafka broker from @EmbeddedKafka
spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers}

# ? Kafka topic used in this task
general.kafka-topic=test-topic

# ? Consumer configuration
spring.kafka.consumer.group-id=midas-core-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.jpmc.midascore.foundation.Transaction

# ? Producer configuration (IMPORTANT FIX)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ? Misc
spring.main.allow-bean-definition-overriding=true



############################################
# ? DATABASE CONFIGURATION (H2 IN-MEMORY)
############################################

# H2 database setup for JPA
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate/JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Enable H2 Console for debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

############################################
# ? LOGGING CONFIGURATION
############################################

# Set logging level
logging.level.org.springframework=INFO
logging.level.com.jpmc.midascore=DEBUG
# ==============================
# ? TASK FOUR - INCENTIVE API URL
# ==============================
incentive.api.url=http://localhost:8080
server.port=33400






